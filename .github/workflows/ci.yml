name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4/libadwaita/GStreamer bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-base xvfb

      - name: Syntax check
        run: python3 -m py_compile *.py src/dictator/*.py tests/*.py

      - name: Pure unit tests (no display needed)
        run: python3 -m unittest discover -s tests -v

      - name: Regression check (needs a display for GTK/GStreamer init)
        run: xvfb-run -a python3 check.py
