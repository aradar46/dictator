app-id: io.github.aradar46.Dictator
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: dictator

finish-args:
  - --socket=wayland
  - --device=dri
  # Microphone capture (PipeWire socket on modern systems).
  - --socket=pulseaudio
  # Moonshine downloads ~450 MB of .ort models to the cache on first run.
  - --share=network

modules:
  # sounddevice dlopens libportaudio, which the GNOME runtime does not ship.
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # portaudio 19.7.0 declares cmake_minimum_required below what CMake 4 accepts.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DPA_BUILD_TESTS=OFF
      - -DPA_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  # Without this the Gdk clipboard drops the selection the moment the app
  # quits, so "Copy & Close" silently loses the dictated text.
  - name: wl-clipboard
    buildsystem: meson
    # Completions default to absolute /usr paths, outside the build sandbox.
    config-opts:
      - -Dfishcompletiondir=no
      - -Dzshcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb

  - name: dictator
    buildsystem: simple
    # ponytail: pip pulls wheels live instead of vendoring pinned sources.
    # ceiling: build is not reproducible and Flathub rejects networked builds.
    # upgrade: run flatpak-pip-generator and swap this for pinned sources when
    # you submit to Flathub or need byte-identical rebuilds.
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app moonshine-voice==0.1.5
      - install -Dm644 desktop_app.py /app/share/dictator/desktop_app.py
      - install -Dm755 flatpak-launcher.sh /app/bin/dictator
      - install -Dm644 io.github.aradar46.Dictator.desktop
        /app/share/applications/io.github.aradar46.Dictator.desktop
      # The repo copy points at a checkout path; in the sandbox it is on PATH.
      - sed -i 's|^Exec=.*|Exec=dictator|'
        /app/share/applications/io.github.aradar46.Dictator.desktop
      - install -Dm644 icon.png
        /app/share/icons/hicolor/512x512/apps/io.github.aradar46.Dictator.png
    sources:
      - type: dir
        path: .
