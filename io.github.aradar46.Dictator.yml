app-id: io.github.aradar46.Dictator
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: dictator

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Microphone capture.
  - --socket=pulseaudio
  # Whisper models are downloaded from huggingface.co on first use.
  - --share=network
  # Engine build, downloaded models and the config file.
  - --filesystem=xdg-cache/dictator:create
  # Tray icon (org.kde.StatusNotifierItem); absent on desktops without a watcher.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: whisper-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_BUILD_EXAMPLES=ON
      - -DGGML_CUDA=OFF
      - -DGGML_VULKAN=OFF
      - -DGGML_NATIVE=OFF
    build-commands:
      - install -Dm755 bin/whisper-cli /app/bin/whisper-cli
    no-make-install: true
    sources:
      - type: archive
        url: https://codeload.github.com/ggml-org/whisper.cpp/tar.gz/306c88f4d1286aec1bf96e544632897886af5501
        sha256: f3585ebf64df3e41b26c45d93bdb38b423ca1de0bf40cc4b6d320254867a75df
        archive-type: tar-gzip

  - name: dictator
    buildsystem: simple
    build-commands:
      - install -Dm755 src/dictator/dictator.py /app/bin/dictator
      - install -Dm644 -t /app/bin src/dictator/transcriber.py src/dictator/shortcuts.py
        src/dictator/recorder.py src/dictator/session.py src/dictator/background.py
        src/dictator/tray.py
      - install -Dm644 io.github.aradar46.Dictator.desktop
        /app/share/applications/io.github.aradar46.Dictator.desktop
      - install -Dm644 io.github.aradar46.Dictator.metainfo.xml
        /app/share/metainfo/io.github.aradar46.Dictator.metainfo.xml
      - install -Dm644 icon_transparent.png
        /app/share/icons/hicolor/512x512/apps/io.github.aradar46.Dictator.png
    sources:
      - type: dir
        path: .
